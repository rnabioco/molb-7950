version: 2
updates:
  # Note: Dependabot has no pixi/conda ecosystem. R and Bioconductor versions are
  # pinned in pixi.lock and are refreshed by .github/workflows/pixi-update.yaml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
